#### This is the default center of the map (lat, lon)
mapcenter=lat=24,lon=-90

#### ------------------ Related with the Zoom ----------------------
####  How many zoom levels we want
zoomLevels=18
#### Is the initial zoom of the map, it goes from 0 (farthest) to 'zoomLevels'(closest)
zoom=2
#### How much it gets zoomed each time (2 means twice as big). It 
#### ha to be a number grater than 1
zoomFactor=2

# Maximum scale of the map. Bigger number means you can see the map from farther away
# maxResolution

##### The possible background layers are: 
##### wms (for a background layer defined through the XML files)
##### osm (for OpenStreetMap), 
##### binga (For bing aerial map), 
##### bingr (for bing road map) 
##### bingh (for bing hybrid map, this means both road and aerial)
##### google maps

#Default configurable background it can be any of wms;osm;bingr;binga;bingh;google;googler
# Use OSM so the map loads without the old UNAM/GEBCO WMS servers.
backgroundLayer=osm

#Default max resolution
maxResolution=20000

#resolutions for maps (aligned with availableBackgroundLayers)
availableMaxResolution=20000;20000;20000

#Available backgrounds
# Bing options need a valid Azure Maps / Bing key in bingMapsKey (the old hardcoded key is revoked).
# Without a key, leave Bing out of this list or those choices load a blank map.
# WMS basemaps belong in layer XML (MainLayers), not this background picker.
availableBackgroundLayers=osm;google;googler

availableBackgroundNames=Open Street Map;Google Earth;Google Roads

# Optional Bing Maps key. When set, you can add bingr;binga;bingh back to availableBackgroundLayers.
bingMapsKey=

